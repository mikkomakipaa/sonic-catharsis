<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provoke Me Plates</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--page:#e4ddcf;--ink:#211e1a}
@media (prefers-color-scheme:dark){:root{--page:#111010;--ink:#e6dfd0}}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Special Elite','Courier New',monospace}
main{max-width:1280px;margin:0 auto;padding:24px 16px}
h1{font-size:18px;font-weight:normal;letter-spacing:.08em;margin:0 0 4px}
p{font-size:13px;margin:0 0 20px;opacity:.75}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
svg{width:100%;height:auto;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
</style></head><body><main>
<h1>PROVOKE ME — STIMULUS PLATES (SAMPLES)</h1>
<p>Plate style test: three of ~40. Line art, one accent color, typewriter captions. Follows light/dark mode.</p>
<div class="grid">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="f14t f14d">
  <title id="f14t">Fig. 14 — Unattended trolley</title>
  <desc id="f14d">A subject walks away from a shopping trolley left in parking bay 3, two metres from an empty trolley return.</desc>
  <style>
    .bg{fill:#f1ece0}.ink{stroke:#211e1a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1}.acc{stroke:#a3352a;fill:none;stroke-width:1.4;stroke-linecap:round}.dash{stroke-dasharray:4 4}
    .t{fill:#211e1a;font-family:'Special Elite','Courier New',monospace;font-size:11px}.lbl{font-size:14px}.ta{fill:#a3352a}
    @media (prefers-color-scheme:dark){.bg{fill:#1b1917}.ink{stroke:#e6dfd0}.acc{stroke:#e0715f}.t{fill:#e6dfd0}.ta{fill:#e0715f}}
  </style>
  <rect class="bg" width="400" height="300"/>
  <rect class="ink thin" x="6" y="6" width="388" height="288"/>

  <!-- ground + bay markings -->
  <line class="ink" x1="20" y1="210" x2="380" y2="210"/>
  <line class="ink thin" x1="150" y1="210" x2="150" y2="218"/>
  <line class="ink thin" x1="260" y1="210" x2="260" y2="218"/>
  <text class="t" x="186" y="228" font-size="9">BAY 3</text>

  <!-- A: subject, departing -->
  <circle class="ink" cx="80" cy="120" r="9"/>
  <line class="ink" x1="80" y1="129" x2="80" y2="170"/>
  <line class="ink" x1="80" y1="170" x2="68" y2="208"/>
  <line class="ink" x1="80" y1="170" x2="92" y2="208"/>
  <line class="ink" x1="80" y1="140" x2="66" y2="156"/>
  <line class="ink" x1="80" y1="140" x2="94" y2="154"/>
  <line class="ink thin" x1="100" y1="128" x2="114" y2="128"/>
  <line class="ink thin" x1="102" y1="138" x2="120" y2="138"/>
  <line class="ink thin" x1="100" y1="148" x2="112" y2="148"/>
  <text class="t lbl" x="44" y="100">A</text>
  <line class="ink thin" x1="54" y1="104" x2="72" y2="114"/>

  <!-- B: trolley -->
  <polygon class="ink" points="170,160 235,160 225,190 180,190"/>
  <line class="ink thin" x1="186" y1="160" x2="190" y2="190"/>
  <line class="ink thin" x1="202" y1="160" x2="202" y2="190"/>
  <line class="ink thin" x1="218" y1="160" x2="214" y2="190"/>
  <line class="ink thin" x1="174" y1="175" x2="230" y2="175"/>
  <line class="ink" x1="235" y1="160" x2="248" y2="150"/>
  <line class="ink" x1="180" y1="190" x2="182" y2="200"/>
  <line class="ink" x1="182" y1="200" x2="225" y2="200"/>
  <circle class="ink" cx="186" cy="204" r="4"/>
  <circle class="ink" cx="221" cy="204" r="4"/>
  <text class="t lbl" x="196" y="140">B</text>
  <line class="ink thin" x1="201" y1="144" x2="201" y2="158"/>

  <!-- C: trolley return, unoccupied -->
  <line class="ink" x1="292" y1="140" x2="378" y2="140"/>
  <line class="ink" x1="300" y1="140" x2="300" y2="210"/>
  <line class="ink" x1="370" y1="140" x2="370" y2="210"/>
  <rect class="ink thin" x="313" y="118" width="44" height="16"/>
  <text class="t" x="317" y="130" font-size="9">RETURN</text>
  <rect class="ink thin dash" x="312" y="165" width="46" height="35"/>
  <text class="t lbl" x="374" y="114">C</text>
  <line class="ink thin" x1="372" y1="117" x2="360" y2="124"/>

  <!-- measured distance -->
  <line class="acc" x1="236" y1="238" x2="300" y2="238"/>
  <line class="acc" x1="236" y1="232" x2="236" y2="244"/>
  <line class="acc" x1="300" y1="232" x2="300" y2="244"/>
  <text class="t ta" x="252" y="252">2.0 m</text>

  <!-- caption -->
  <text class="t" x="20" y="270" font-size="10">FIG. 14 — Stimulus: unattended trolley, bay 3.</text>
  <text class="t" x="20" y="285" font-size="8.5">A: subject, departing. B: trolley. C: return, empty.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="f22t f22d">
  <title id="f22t">Fig. 22 — Reheated fish</title>
  <desc id="f22d">A fish is reheated in a shared office microwave. Odour waves spread to a subject at a desk fourteen metres away, holding their nose.</desc>
  <style>
    .bg{fill:#f1ece0}.ink{stroke:#211e1a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1}.acc{stroke:#a3352a;fill:none;stroke-width:1.4;stroke-linecap:round}.dash{stroke-dasharray:4 4}
    .t{fill:#211e1a;font-family:'Special Elite','Courier New',monospace;font-size:11px}.lbl{font-size:14px}.ta{fill:#a3352a}
    @media (prefers-color-scheme:dark){.bg{fill:#1b1917}.ink{stroke:#e6dfd0}.acc{stroke:#e0715f}.t{fill:#e6dfd0}.ta{fill:#e0715f}}
  </style>
  <rect class="bg" width="400" height="300"/>
  <rect class="ink thin" x="6" y="6" width="388" height="288"/>

  <!-- counter -->
  <line class="ink" x1="20" y1="170" x2="200" y2="170"/>
  <line class="ink" x1="20" y1="178" x2="200" y2="178"/>
  <line class="ink thin" x1="30" y1="178" x2="30" y2="230"/>
  <line class="ink thin" x1="190" y1="178" x2="190" y2="230"/>
  <line class="ink thin" x1="110" y1="178" x2="110" y2="230"/>
  <line class="ink" x1="20" y1="230" x2="385" y2="230"/>

  <!-- A: microwave + fish -->
  <rect class="ink" x="50" y="110" width="110" height="60"/>
  <rect class="ink thin" x="57" y="117" width="74" height="46"/>
  <line class="ink thin" x1="137" y1="110" x2="137" y2="170"/>
  <circle class="ink thin" cx="148" cy="126" r="3"/>
  <circle class="ink thin" cx="148" cy="138" r="3"/>
  <rect class="ink thin" x="141" y="149" width="14" height="8"/>
  <line class="ink" x1="72" y1="140" x2="113" y2="140"/>
  <polygon class="ink" points="113,140 119,133 127,140 119,147"/>
  <polygon class="ink" points="72,140 63,133 63,147"/>
  <line class="ink thin" x1="80" y1="135" x2="80" y2="145"/>
  <line class="ink thin" x1="88" y1="134" x2="88" y2="146"/>
  <line class="ink thin" x1="96" y1="134" x2="96" y2="146"/>
  <line class="ink thin" x1="104" y1="135" x2="104" y2="145"/>
  <ellipse class="ink thin" cx="94" cy="156" rx="30" ry="3"/>
  <text class="t lbl" x="30" y="98">A</text>
  <line class="ink thin" x1="40" y1="102" x2="60" y2="120"/>

  <!-- B: odour radius -->
  <path class="acc dash" d="M145,70.7 A80 80 0 0 1 145,209.3"/>
  <path class="acc dash" d="M193.4,51.6 A125 125 0 0 1 193.4,228.4"/>
  <path class="acc dash" d="M244.2,42.4 A170 170 0 0 1 244.2,237.6"/>
  <text class="t lbl ta" x="256" y="48">B</text>

  <!-- C: subject at desk -->
  <line class="ink" x1="300" y1="180" x2="385" y2="180"/>
  <line class="ink thin" x1="305" y1="180" x2="305" y2="230"/>
  <line class="ink thin" x1="380" y1="180" x2="380" y2="230"/>
  <rect class="ink thin" x="355" y="160" width="24" height="20"/>
  <circle class="ink" cx="335" cy="125" r="9"/>
  <line class="ink" x1="335" y1="134" x2="335" y2="172"/>
  <line class="ink" x1="335" y1="145" x2="328" y2="128"/>
  <line class="ink" x1="335" y1="145" x2="352" y2="166"/>
  <line class="ink" x1="335" y1="172" x2="322" y2="198"/>
  <line class="ink" x1="322" y1="198" x2="322" y2="228"/>
  <text class="t lbl" x="356" y="108">C</text>
  <line class="ink thin" x1="354" y1="111" x2="344" y2="119"/>

  <!-- measured distance -->
  <line class="acc" x1="200" y1="246" x2="335" y2="246"/>
  <line class="acc" x1="200" y1="240" x2="200" y2="252"/>
  <line class="acc" x1="335" y1="240" x2="335" y2="252"/>
  <text class="t ta" x="252" y="243">14 m</text>

  <!-- caption -->
  <text class="t" x="20" y="270" font-size="10">FIG. 22 — Stimulus: reheated fish, shared microwave.</text>
  <text class="t" x="20" y="285" font-size="8.5">A: source. B: odour radius (est.). C: subject, desk 14 m.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="f31t f31d">
  <title id="f31t">Fig. 31 — Bus "arriving"</title>
  <desc id="f31d">A bus stop display shows "55, 1 min" at zero, four, eight and twelve minutes. A graph shows the subject's patience falling over time.</desc>
  <style>
    .bg{fill:#f1ece0}.ink{stroke:#211e1a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1}.acc{stroke:#a3352a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}
    .t{fill:#211e1a;font-family:'Special Elite','Courier New',monospace;font-size:11px}.lbl{font-size:14px}.ta{fill:#a3352a}
    .led{fill:#211e1a}.ledt{fill:#f1ece0;font-family:'Courier New',monospace;font-size:13px;font-weight:bold}
    @media (prefers-color-scheme:dark){.bg{fill:#1b1917}.ink{stroke:#e6dfd0}.acc{stroke:#e0715f}.t{fill:#e6dfd0}.ta{fill:#e0715f}.led{fill:#e6dfd0}.ledt{fill:#1b1917}}
  </style>
  <rect class="bg" width="400" height="300"/>
  <rect class="ink thin" x="6" y="6" width="388" height="288"/>

  <!-- B: display at four intervals -->
  <text class="t" x="22" y="26" font-size="9">t = 0</text>
  <text class="t" x="111" y="26" font-size="9">t = 4 min</text>
  <text class="t" x="200" y="26" font-size="9">t = 8 min</text>
  <text class="t" x="289" y="26" font-size="9">t = 12 min</text>
  <rect class="led" x="20" y="32" width="80" height="30"/>
  <rect class="led" x="109" y="32" width="80" height="30"/>
  <rect class="led" x="198" y="32" width="80" height="30"/>
  <rect class="led" x="287" y="32" width="80" height="30"/>
  <text class="ledt" x="27" y="52">55  1 min</text>
  <text class="ledt" x="116" y="52">55  1 min</text>
  <text class="ledt" x="205" y="52">55  1 min</text>
  <text class="ledt" x="294" y="52">55  1 min</text>
  <text class="t lbl" x="374" y="52">B</text>

  <!-- C: patience curve -->
  <line class="ink" x1="50" y1="90" x2="50" y2="220"/>
  <line class="ink" x1="50" y1="220" x2="230" y2="220"/>
  <line class="ink thin" x1="50" y1="220" x2="50" y2="226"/>
  <line class="ink thin" x1="105" y1="220" x2="105" y2="226"/>
  <line class="ink thin" x1="160" y1="220" x2="160" y2="226"/>
  <line class="ink thin" x1="215" y1="220" x2="215" y2="226"/>
  <text class="t" x="47" y="238" font-size="9">0</text>
  <text class="t" x="102" y="238" font-size="9">4</text>
  <text class="t" x="157" y="238" font-size="9">8</text>
  <text class="t" x="209" y="238" font-size="9">12</text>
  <text class="t" x="236" y="224" font-size="9">min</text>
  <text class="t" x="22" y="155" font-size="9" transform="rotate(-90 32 155)">PATIENCE</text>
  <path class="acc" d="M52,96 L105,104 L112,128 L160,138 L166,178 L212,190 L215,216"/>
  <circle class="acc" cx="215" cy="216" r="2.5"/>
  <text class="t lbl ta" x="124" y="116">C</text>

  <!-- A: subject at stop -->
  <line class="ink" x1="270" y1="225" x2="385" y2="225"/>
  <line class="ink" x1="295" y1="120" x2="295" y2="225"/>
  <rect class="ink" x="281" y="100" width="28" height="20"/>
  <text class="t" x="286" y="114" font-size="10">55</text>
  <circle class="ink" cx="342" cy="150" r="9"/>
  <line class="ink" x1="341" y1="159" x2="338" y2="192"/>
  <line class="ink" x1="340" y1="168" x2="330" y2="190"/>
  <line class="ink" x1="340" y1="168" x2="350" y2="190"/>
  <line class="ink" x1="338" y1="192" x2="332" y2="224"/>
  <line class="ink" x1="338" y1="192" x2="346" y2="224"/>
  <text class="t" x="356" y="138" font-size="10">…</text>
  <text class="t lbl" x="368" y="166">A</text>
  <line class="ink thin" x1="366" y1="162" x2="354" y2="156"/>

  <!-- caption -->
  <text class="t" x="20" y="270" font-size="10">FIG. 31 — Stimulus: bus 55, status "arriving".</text>
  <text class="t" x="20" y="285" font-size="8.5">A: subject. B: display, four readings. C: patience, observed.</text>
</svg>
</div></main></body></html>
