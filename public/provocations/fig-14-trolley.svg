<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" role="img" aria-labelledby="f14t f14d">
  <title id="f14t">Fig. 14 — Unattended trolley</title>
  <desc id="f14d">A subject walks away from a shopping trolley left in parking bay 3, two metres from an empty trolley return.</desc>
  <style>
    .bg{fill:#f1ece0}.ink{stroke:#211e1a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1}.acc{stroke:#a3352a;fill:none;stroke-width:1.4;stroke-linecap:round}.dash{stroke-dasharray:4 4}
    .t{fill:#211e1a;font-family:'Special Elite','Courier New',monospace;font-size:11px}.lbl{font-size:14px}.ta{fill:#a3352a}
  </style>

  <!-- ground + bay markings -->
  <line class="ink" x1="20" y1="210" x2="380" y2="210"/>
  <line class="ink thin" x1="150" y1="210" x2="150" y2="218"/>
  <line class="ink thin" x1="260" y1="210" x2="260" y2="218"/>
  <text class="t" x="186" y="228" font-size="9">BAY 3</text>

  <!-- A: subject, departing -->
  <circle class="ink" cx="80" cy="120" r="9"/>
  <line class="ink" x1="80" y1="129" x2="80" y2="170"/>
  <line class="ink" x1="80" y1="170" x2="68" y2="208"/>
  <line class="ink" x1="80" y1="170" x2="92" y2="208"/>
  <line class="ink" x1="80" y1="140" x2="66" y2="156"/>
  <line class="ink" x1="80" y1="140" x2="94" y2="154"/>
  <line class="ink thin" x1="100" y1="128" x2="114" y2="128"/>
  <line class="ink thin" x1="102" y1="138" x2="120" y2="138"/>
  <line class="ink thin" x1="100" y1="148" x2="112" y2="148"/>
  <text class="t lbl" x="44" y="100">A</text>
  <line class="ink thin" x1="54" y1="104" x2="72" y2="114"/>

  <!-- B: trolley -->
  <polygon class="ink" points="170,160 235,160 225,190 180,190"/>
  <line class="ink thin" x1="186" y1="160" x2="190" y2="190"/>
  <line class="ink thin" x1="202" y1="160" x2="202" y2="190"/>
  <line class="ink thin" x1="218" y1="160" x2="214" y2="190"/>
  <line class="ink thin" x1="174" y1="175" x2="230" y2="175"/>
  <line class="ink" x1="235" y1="160" x2="248" y2="150"/>
  <line class="ink" x1="180" y1="190" x2="182" y2="200"/>
  <line class="ink" x1="182" y1="200" x2="225" y2="200"/>
  <circle class="ink" cx="186" cy="204" r="4"/>
  <circle class="ink" cx="221" cy="204" r="4"/>
  <text class="t lbl" x="196" y="140">B</text>
  <line class="ink thin" x1="201" y1="144" x2="201" y2="158"/>

  <!-- C: trolley return, unoccupied -->
  <line class="ink" x1="292" y1="140" x2="378" y2="140"/>
  <line class="ink" x1="300" y1="140" x2="300" y2="210"/>
  <line class="ink" x1="370" y1="140" x2="370" y2="210"/>
  <rect class="ink thin" x="313" y="118" width="44" height="16"/>
  <text class="t" x="317" y="130" font-size="9">RETURN</text>
  <rect class="ink thin dash" x="312" y="165" width="46" height="35"/>
  <text class="t lbl" x="374" y="114">C</text>
  <line class="ink thin" x1="372" y1="117" x2="360" y2="124"/>

  <!-- measured distance -->
  <line class="acc" x1="236" y1="238" x2="300" y2="238"/>
  <line class="acc" x1="236" y1="232" x2="236" y2="244"/>
  <line class="acc" x1="300" y1="232" x2="300" y2="244"/>
  <text class="t ta" x="252" y="252">2.0 m</text>

</svg>
