<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" role="img" aria-labelledby="f22t f22d">
  <title id="f22t">Fig. 22 — Reheated fish</title>
  <desc id="f22d">A fish is reheated in a shared office microwave. Odour waves spread to a subject at a desk fourteen metres away, holding their nose.</desc>
  <style>
    .bg{fill:#f1ece0}.ink{stroke:#211e1a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1}.acc{stroke:#a3352a;fill:none;stroke-width:1.4;stroke-linecap:round}.dash{stroke-dasharray:4 4}
    .t{fill:#211e1a;font-family:'Special Elite','Courier New',monospace;font-size:11px}.lbl{font-size:14px}.ta{fill:#a3352a}
  </style>

  <!-- counter -->
  <line class="ink" x1="20" y1="170" x2="200" y2="170"/>
  <line class="ink" x1="20" y1="178" x2="200" y2="178"/>
  <line class="ink thin" x1="30" y1="178" x2="30" y2="230"/>
  <line class="ink thin" x1="190" y1="178" x2="190" y2="230"/>
  <line class="ink thin" x1="110" y1="178" x2="110" y2="230"/>
  <line class="ink" x1="20" y1="230" x2="385" y2="230"/>

  <!-- A: microwave + fish -->
  <rect class="ink" x="50" y="110" width="110" height="60"/>
  <rect class="ink thin" x="57" y="117" width="74" height="46"/>
  <line class="ink thin" x1="137" y1="110" x2="137" y2="170"/>
  <circle class="ink thin" cx="148" cy="126" r="3"/>
  <circle class="ink thin" cx="148" cy="138" r="3"/>
  <rect class="ink thin" x="141" y="149" width="14" height="8"/>
  <line class="ink" x1="72" y1="140" x2="113" y2="140"/>
  <polygon class="ink" points="113,140 119,133 127,140 119,147"/>
  <polygon class="ink" points="72,140 63,133 63,147"/>
  <line class="ink thin" x1="80" y1="135" x2="80" y2="145"/>
  <line class="ink thin" x1="88" y1="134" x2="88" y2="146"/>
  <line class="ink thin" x1="96" y1="134" x2="96" y2="146"/>
  <line class="ink thin" x1="104" y1="135" x2="104" y2="145"/>
  <ellipse class="ink thin" cx="94" cy="156" rx="30" ry="3"/>
  <text class="t lbl" x="30" y="98">A</text>
  <line class="ink thin" x1="40" y1="102" x2="60" y2="120"/>

  <!-- B: odour radius -->
  <path class="acc dash" d="M145,70.7 A80 80 0 0 1 145,209.3"/>
  <path class="acc dash" d="M193.4,51.6 A125 125 0 0 1 193.4,228.4"/>
  <path class="acc dash" d="M244.2,42.4 A170 170 0 0 1 244.2,237.6"/>
  <text class="t lbl ta" x="256" y="48">B</text>

  <!-- C: subject at desk -->
  <line class="ink" x1="300" y1="180" x2="385" y2="180"/>
  <line class="ink thin" x1="305" y1="180" x2="305" y2="230"/>
  <line class="ink thin" x1="380" y1="180" x2="380" y2="230"/>
  <rect class="ink thin" x="355" y="160" width="24" height="20"/>
  <circle class="ink" cx="335" cy="125" r="9"/>
  <line class="ink" x1="335" y1="134" x2="335" y2="172"/>
  <line class="ink" x1="335" y1="145" x2="328" y2="128"/>
  <line class="ink" x1="335" y1="145" x2="352" y2="166"/>
  <line class="ink" x1="335" y1="172" x2="322" y2="198"/>
  <line class="ink" x1="322" y1="198" x2="322" y2="228"/>
  <text class="t lbl" x="356" y="108">C</text>
  <line class="ink thin" x1="354" y1="111" x2="344" y2="119"/>

  <!-- measured distance -->
  <line class="acc" x1="200" y1="246" x2="335" y2="246"/>
  <line class="acc" x1="200" y1="240" x2="200" y2="252"/>
  <line class="acc" x1="335" y1="240" x2="335" y2="252"/>
  <text class="t ta" x="252" y="243">14 m</text>

</svg>
